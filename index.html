<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDO Biñan City Vehicle Request</title>
    
    <link rel="icon" href="https://www.depedbinancity.ph/static/images/DOB_LOGO.png" type="image/png">
 <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      
      /* The Splash Screen */
      #splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #003366; /* Adjust this to your brand color */
        color: white;
        display: flex; flex-direction: column; 
        align-items: center; justify-content: center;
        z-index: 9999;
        cursor: pointer; /* Makes it look clickable */
        transition: opacity 0.5s ease;
      }

      /* Logo/Title Styling */
      .brand-box { text-align: center; font-family: sans-serif; }
      .brand-box h1 { margin-bottom: 10px; }
      .brand-box p { opacity: 0.8; font-style: italic; }

      /* The Iframe */
      iframe { width: 100%; height: 100%; border: none; }
    </style>
  </head>
  <body>

    <div id="splash-screen" onclick="launchApp()">
      <div class="brand-box">
        <h1>SDO Biñan City</h1>
        <p>Transportation Request System</p>
        <br>
        <p style="font-weight: bold;">[ Click anywhere to enter ]</p>
      </div>
    </div>

    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwj8gfTWCSgQa_dxQi2fLZMC1yVvOMbpWi8-J3oSilCTjIp4YUpqylbAzDQSA7SZxwPiw/exec"
      allowfullscreen="true">
    </iframe>

    <script>
      function launchApp() {
        const splash = document.getElementById("splash-screen");
        
        // Hide the splash screen nicely
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 500);
        
        // Trigger Fullscreen
        document.documentElement.requestFullscreen().catch((err) => {
          console.error(`Fullscreen Error: ${err.message}`);
        });
      }
    </script>
  </body>
</html>
