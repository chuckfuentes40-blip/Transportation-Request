<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDO Biñan City Vehicle Request</title>

    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="logo-192.png" type="image/png">
    <link rel="apple-touch-icon" href="logo-192.png">

    <style>
      body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
        background: #003366; 
      }
      
      #splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        color: white;
        display: flex; flex-direction: column; 
        align-items: center; justify-content: center;
        z-index: 9999;
        cursor: pointer;
        transition: opacity 0.5s ease;
        font-family: sans-serif;
        overflow: hidden;
      }

      /* Responsive Fullscreen Video Background */
      #bg-video {
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -1;
        transform: translate(-50%, -50%);
        object-fit: cover;
      }

      /* Content container overlay */
      .splash-content {
        text-align: center;
        z-index: 1;
        background: rgba(0, 51, 102, 0.45); /* Soft overlay to keep text readable */
        padding: 20px 40px;
        border-radius: 12px;
        backdrop-filter: blur(4px);
      }

      iframe { 
        width: 100%; height: 100%; border: none; 
      }
    </style>
  </head>
  <body>

    <div id="splash-screen" onclick="launchApp()">
      <!-- Responsive Video element -->
      <video autoplay loop muted playsinline id="bg-video">
        <source src="your-video-file.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <div class="splash-content">
        <h1>SDO Biñan City</h1>
        <p>Transportation Request System</p>
        <br>
        <p style="font-weight: bold; border: 1px solid white; padding: 10px; border-radius: 6px;">
          CLICK TO ENTER
        </p>
      </div>
    </div>

    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwj8gfTWCSgQa_dxQi2fLZMC1yVvOMbpWi8-J3oSilCTjIp4YUpqylbAzDQSA7SZxwPiw/exec"
      allowfullscreen="true">
    </iframe>

    <script>
      function launchApp() {
        const splash = document.getElementById("splash-screen");
        
        // Hide Splash
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 500);
        
        // Request Fullscreen
        document.documentElement.requestFullscreen().catch((err) => {
          console.warn(`Fullscreen skipped: ${err.message}`);
        });
      }
    </script>
  </body>
</html>
