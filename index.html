<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDO Biñan City Vehicle Request</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="./logo.png?v=1.0" type="image/png">
    <link rel="icon" href="https://www.depedbinancity.ph/static/images/DOB_LOGO.png" type="image/png">
 <style>
      /* Basic Reset */
      body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
        background: #003366; /* Matches the dark professional look */
      }
      
      /* Splash Screen Styling */
      #splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #003366; 
        color: white;
        display: flex; flex-direction: column; 
        align-items: center; justify-content: center;
        z-index: 9999;
        cursor: pointer;
        transition: opacity 0.5s ease;
        font-family: sans-serif;
      }

      /* Iframe Styling */
      iframe { 
        width: 100%; height: 100%; border: none; 
      }
    </style>
  </head>
  <body>
    <div id="splash-screen" onclick="launchApp()">
      <div style="text-align: center;">
        <h1>SDO Biñan City</h1>
        <p>Transportation Request System</p>
        <br>
        <p style="font-weight: bold; border: 1px solid white; padding: 10px;">
          CLICK TO ENTER
        </p>
      </div>
    </div>
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwj8gfTWCSgQa_dxQi2fLZMC1yVvOMbpWi8-J3oSilCTjIp4YUpqylbAzDQSA7SZxwPiw/exec"
      allowfullscreen="true">
    </iframe>
    <script>
      function launchApp() {
        const splash = document.getElementById("splash-screen");
        // Fade out splash screen
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 500);
        // Request fullscreen on the whole page
        document.documentElement.requestFullscreen().catch((err) => {
          console.warn(`Fullscreen request skipped: ${err.message}`);
        });
      }
    </script>
  </body>
</html>
